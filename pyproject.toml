[project]
name = "analytics-dashboard"
version = "0.1.0"
description = "Weekly metrics report for Android apps"
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-storage>=3.17.1",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[project.scripts]
weekly-report = "weekly_report.__main__:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "weekly_report"
